name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 src/ app/ --max-line-length=120 --ignore=E501,W503

      - name: Test imports
        run: |
          python -c "from src.ingestion.load_documents import load_all_pdfs; print('load_documents OK')"
          python -c "from src.ingestion.clean_documents import clean_documents; print('clean_documents OK')"
          python -c "from src.ingestion.chunk_documents import chunk_documents; print('chunk_documents OK')"
          python -c "from src.retrieval.create_vectorstore import create_vectorstore; print('create_vectorstore OK')"
          python -c "from src.rag.prompt import prompt; print('prompt OK')"
          python -c "from src.rag.rag_chain import build_rag_chain; print('rag_chain OK')"